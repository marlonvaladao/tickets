<ion-tabs>
    <ion-tab-bar slot="bottom">
  
      <ion-tab-button tab="tab1" (click)="setSelectedTab('tab1')">
        <img src="assets/icon/totem.svg"
             [style.filter]="selectedTab === 'tab1' ? 'invert(29%) sepia(93%) saturate(696%) hue-rotate(151deg) brightness(93%) contrast(95%)' : 'grayscale(80%)'"
             style="width: 26px; height: 24px;" />
        <ion-label [style.color]="selectedTab === 'tab1' ? '#00bcd4' : '#666'">Totem</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab2" (click)="setSelectedTab('tab2')">
        <img src="assets/icon/atendente.svg"
             [style.filter]="selectedTab === 'tab2' ? 'invert(29%) sepia(93%) saturate(696%) hue-rotate(151deg) brightness(93%) contrast(95%)' : 'grayscale(80%)'"
             style="width: 24px; height: 24px;" />
        <ion-label [style.color]="selectedTab === 'tab2' ? '#00bcd4' : '#666'">Atendente</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tabPainel" (click)="setSelectedTab('tabPainel')">
        <ion-icon name="desktop-outline"
                  [style.color]="selectedTab === 'tabPainel' ? '#00bcd4' : '#666'"></ion-icon>
        <ion-label [style.color]="selectedTab === 'tabPainel' ? '#00bcd4' : '#666'">Painel</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab4" (click)="setSelectedTab('tab4')">
        <ion-icon name="document-text-outline"
                  [style.color]="selectedTab === 'tab4' ? '#00bcd4' : '#666'"></ion-icon>
        <ion-label [style.color]="selectedTab === 'tab4' ? '#00bcd4' : '#666'">Relatórios</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab3" (click)="setSelectedTab('tab3')">
        <ion-icon name="information-circle-outline"
                  [style.color]="selectedTab === 'tab3' ? '#00bcd4' : '#666'"></ion-icon>
        <ion-label [style.color]="selectedTab === 'tab3' ? '#00bcd4' : '#666'">Sobre</ion-label>
      </ion-tab-button>
  
    </ion-tab-bar>
  </ion-tabs>
